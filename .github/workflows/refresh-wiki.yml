name: Refresh faculty wiki

# 연 2회(3월 1일·9월 1일) 03:00 UTC(한국시간 정오)에 교원 홈페이지를 다시 크롤링하고,
# (GEMINI_API_KEY 시크릿이 설정되어 있으면) Gemini API로 원문을 요약한 뒤,
# 위키를 재생성해 main에 직접 커밋합니다. 이 러너는 (Claude Code 세션과
# 달리) 일반 인터넷에 접근할 수 있어 scripts/crawl_homepages.py 를
# 그대로 실행할 수 있습니다. 자세한 내용은 CLAUDE.md 참고.
#
# 예외: 2026-09-01 예정 실행은 건너뜁니다 — 2026-08-28에 수동으로 이미 전체 갱신을
# 마쳤기 때문 (아래 gate job 참고). 2027-03-01부터는 정상적으로 다시 돕니다.
"on":
  schedule:
    - cron: "0 3 1 3,9 *"
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

concurrency:
  group: refresh-wiki
  cancel-in-progress: false

jobs:
  gate:
    # 2026-09-01 예정 자동 갱신은 건너뛴다 — 바로 며칠 전인 2026-08-28에 수동으로 이미
    # 전체 갱신을 마쳤기 때문. 수동 실행(workflow_dispatch)은 이 판단과 무관하게 항상
    # 그대로 실행된다. 이 판단은 2026-09-01이 지나면 더 이상 아무 날짜와도 안 맞아
    # 자연히 무해해지므로, 그 뒤 정리 삼아 이 job과 refresh의 `needs`/`if`를 지워도 된다.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 건너뛸 날짜인지 판단
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-09-01" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "2026-09-01 자동 실행 건너뜀 (2026-08-28에 이미 수동 갱신함)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 크롤링(교원 280명, 서브페이지 포함)만 40~60분, Gemini 요약(255명)도 그만큼 걸릴 수
    # 있어 넉넉히 잡는다. 90분으로는 요약 단계 중간에 강제 취소된 적이 있다(2026-08-28,
    # 크롤링 55분 + 요약 35분 진행 중 타임아웃 — 커밋 전이라 결과가 전부 유실됨).
    timeout-minutes: 180
    env:
      # if: 조건에서는 secrets 컨텍스트를 직접 참조할 수 없어("Unrecognized named-value:
      # 'secrets'") job 레벨 env로 한 번 옮겨 담아 아래 스텝의 if에서 env로 참조한다.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 홈페이지 재크롤링 (전체 갱신)
        run: python3 scripts/crawl_homepages.py --force --insecure --delay 1.0

      - name: 크롤링 결과 중간 커밋 & 푸시
        # 크롤링이 가장 오래 걸리는 단계라, 뒤이은 요약/빌드 단계가 타임아웃 등으로
        # 중단되더라도 여기까지의 크롤링 결과만큼은 git에 남도록 먼저 커밋해둔다.
        run: |
          git add sources/homepage_crawl.json
          if git diff --cached --quiet; then
            echo "크롤링 결과 변경 없음, 커밋 생략"
          else
            git commit -m "chore: 교원 홈페이지 크롤링 결과 (중간 커밋, 요약 전) ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: 홈페이지 원문 AI 요약 (Gemini)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python3 scripts/summarize_homepages.py

      - name: 위키 재생성
        run: python3 scripts/build_wiki.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git add sources/homepage_crawl.json wiki/
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 교원 홈페이지 요약·위키 정기 갱신 ($(date -u +%Y-%m-%d))"
          git push
