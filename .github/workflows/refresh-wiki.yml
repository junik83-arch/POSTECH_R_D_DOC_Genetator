name: Refresh faculty wiki

# 매월 1일 03:00 UTC(한국시간 정오)에 교원 홈페이지를 다시 크롤링하고,
# (GEMINI_API_KEY 시크릿이 설정되어 있으면) Gemini API로 원문을 요약한 뒤,
# 위키를 재생성해 main에 직접 커밋합니다. 이 러너는 (Claude Code 세션과
# 달리) 일반 인터넷에 접근할 수 있어 scripts/crawl_homepages.py 를
# 그대로 실행할 수 있습니다. 자세한 내용은 CLAUDE.md 참고.
"on":
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

concurrency:
  group: refresh-wiki
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 홈페이지 재크롤링 (전체 갱신)
        run: python3 scripts/crawl_homepages.py --force --insecure --delay 1.0

      - name: 홈페이지 원문 AI 요약 (Gemini)
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/summarize_homepages.py

      - name: 위키 재생성
        run: python3 scripts/build_wiki.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/homepage_crawl.json wiki/
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 교원 홈페이지 크롤링 정기 갱신 ($(date -u +%Y-%m-%d))"
          git push
